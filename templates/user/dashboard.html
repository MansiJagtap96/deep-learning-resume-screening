{% extends "base.html" %}
{% block title %}User Dashboard{% endblock %}

{% block content %}



<hr>

<h2>Available Jobs</h2>



<a href="{{ url_for('user.my_applications') }}">My Applied Jobs</a>
<hr>

{% for job in jobs %}
    <div style="border:1px solid #ccc; padding:10px; margin:10px;">
        <h3>{{ job.title }}</h3>
        <p><strong>Position:</strong> {{ job.position }}</p>
        <p><strong>Openings:</strong> {{ job.openings }}</p>
        <p>{{ job.description }}</p>

        <a href="{{ url_for('user.apply', job_id=job.id) }}">Apply</a>
        |
        <a href="{{ url_for('user.compare', job_id=job.id) }}">Compare</a>
    </div>
{% endfor %}
{% endblock %}
