<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard · Job Applications</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #f0f7fd 0%, #e3eef9 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #1e2f40;
            line-height: 1.5;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Header area */
        .dashboard-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 2.5rem;
        }

        .dashboard-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #123b57, #1d628b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            font-weight: 600;
            padding: 0.7rem 1.6rem;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.5);
            background: white;
            color: #1d4e72;
            box-shadow: 0 6px 14px rgba(0,40,70,0.08);
        }

        .btn i {
            font-size: 1rem;
        }

        .btn:hover {
            background: #e1f0fc;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(19,78,120,0.15);
            border-color: #9dc0da;
        }

        .btn-logout {
            background: #fef2e9;
            color: #aa5f2c;
        }
        .btn-logout:hover {
            background: #fee7d8;
        }

        /* Section title */
        .section-title {
            font-size: 1.8rem;
            font-weight: 650;
            color: #0e334d;
            margin: 2rem 0 1.5rem 0;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-title i {
            color: #1c6b9e;
            font-size: 2rem;
        }

        /* Jobs grid */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 1.8rem;
        }

        .job-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 32px;
            padding: 1.8rem 1.8rem 2rem;
            border: 1px solid rgba(255,255,255,0.7);
            box-shadow: 0 20px 35px -12px rgba(0,50,80,0.2);
            transition: transform 0.25s, box-shadow 0.3s;
            display: flex;
            flex-direction: column;
        }

        .job-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 30px 45px -15px #0d334f;
            border-color: #b6d6ef;
        }

        .job-title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: #0b314a;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .job-position {
            font-size: 1.1rem;
            font-weight: 500;
            color: #31688b;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .job-openings {
            background: #e7f1f9;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #17567f;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            width: fit-content;
            margin-bottom: 1.2rem;
            border: 1px solid #c0daef;
        }

        .job-description {
            color: #2b4a66;
            margin-bottom: 1.8rem;
            line-height: 1.6;
            flex: 1;
            border-left: 3px solid #aac9e5;
            padding-left: 1rem;
            font-size: 0.95rem;
        }

        .view-applications-btn {
            background: #0b334f;
            color: white;
            text-decoration: none;
            padding: 0.9rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
            border: 1px solid #22638b;
            margin-top: 0.5rem;
            align-self: flex-start;
        }

        .view-applications-btn i {
            font-size: 1rem;
        }

        .view-applications-btn:hover {
            background: #1a4f74;
            transform: scale(1.02);
            box-shadow: 0 10px 20px -5px #0b334f;
        }

        .empty-state {
            background: rgba(255,255,255,0.7);
            border-radius: 60px;
            padding: 3rem;
            text-align: center;
            color: #487393;
            font-weight: 500;
            border: 2px dashed #aac6dd;
            font-size: 1.2rem;
            grid-column: 1 / -1;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, #c0d8ec, transparent);
            margin: 1.5rem 0;
        }

        /* small tweaks */
        .icon-text {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with actions -->
        <div class="dashboard-header">
            <h2>
                <i class="fas fa-chart-pie" style="color:#1d6b9b;"></i> 
                Admin Dashboard
            </h2>
            <div class="header-actions">
                <a href="/admin/add-job" class="btn">
                    <i class="fas fa-plus-circle"></i> Add Job
                </a>
                <a href="{{ url_for('admin.urgent_hiring') }}" class="btn">
                    <i class="fas fa-bolt"></i> Urgent Hiring
                </a>
                <a href="/admin/logout" class="btn btn-logout">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>

        <hr>

        <!-- All Jobs section -->
        <div class="section-title">
            <i class="fas fa-briefcase"></i> All Jobs
        </div>

        {% if jobs %}
            <div class="jobs-grid">
                {% for job in jobs %}
                    <div class="job-card">
                        <div class="job-title">
                            <i class="fas fa-file-signature" style="color:#1d6b9b;"></i>
                            {{ job.title }}
                        </div>
                        <div class="job-position">
                            <i class="fas fa-tag"></i> {{ job.position }}
                        </div>
                        <div class="job-openings">
                            <i class="fas fa-users"></i> Openings: {{ job.openings }}
                        </div>
                        <div class="job-description">
                            {{ job.description }}
                        </div>
                        <a href="{{ url_for('admin.view_applications', job_id=job.id) }}" class="view-applications-btn">
                            <i class="fas fa-eye"></i> View Applied Students
                        </a>
                    </div>
                {% endfor %}
            </div>
        {% else %}
            <div class="empty-state">
                <i class="fas fa-folder-open" style="font-size: 3rem; opacity: 0.5; margin-bottom: 1rem; display: block;"></i>
                No jobs added yet. Click "Add Job" to create one.
            </div>
        {% endif %}
    </div>
</body>
</html>
