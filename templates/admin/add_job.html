<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Job · Admin</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Font: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(145deg, #f0f7fd 0%, #e3eef9 100%);
            min-height: 100vh;
            padding: 2rem 1.5rem;
            color: #1e2f40;
            line-height: 1.5;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        /* Header */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .page-header h2 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #123b57, #1d628b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-link {
            background: white;
            padding: 0.7rem 1.8rem;
            border-radius: 40px;
            font-weight: 600;
            text-decoration: none;
            color: #1c5379;
            box-shadow: 0 6px 14px rgba(0,40,70,0.1);
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.7);
        }

        .back-link:hover {
            background: #e1f0fc;
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(19,78,120,0.15);
        }

        /* Form card */
        .form-card {
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 2.5rem;
            box-shadow: 0 30px 50px -25px rgba(0,45,80,0.3);
            border: 1px solid rgba(255,255,255,0.7);
        }

        .form-group {
            margin-bottom: 1.8rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            color: #0d3552;
            margin-bottom: 0.5rem;
            font-size: 0.95rem;
            letter-spacing: 0.3px;
        }

        .form-control {
            width: 100%;
            padding: 1rem 1.4rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            border: 2px solid #d0e2f2;
            border-radius: 30px;
            background: white;
            transition: all 0.2s;
            outline: none;
            color: #1d3e5a;
        }

        .form-control:focus {
            border-color: #79b0d5;
            box-shadow: 0 0 0 4px rgba(31, 122, 180, 0.15);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 150px;
        }

        .btn-submit {
            background: #0b334f;
            color: white;
            border: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 60px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: 0.2s;
            border: 1px solid #22638b;
            width: 100%;
            margin-top: 0.5rem;
        }

        .btn-submit:hover {
            background: #1a4f74;
            transform: translateY(-3px);
            box-shadow: 0 15px 25px -8px #0b334f;
        }

        .btn-submit i {
            font-size: 1.2rem;
        }

        .footer-note {
            margin-top: 2rem;
            text-align: center;
            color: #5b7e9b;
            font-size: 0.9rem;
        }

        hr {
            border: none;
            height: 2px;
            background: linear-gradient(to right, #c0d8ec, transparent);
            margin: 1.5rem 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header with back link -->
        <div class="page-header">
            <h2>
                <i class="fas fa-plus-circle" style="color:#1d6b9b;"></i> 
                Add New Job
            </h2>
            <a href="/admin/dashboard" class="back-link">
                <i class="fas fa-arrow-left"></i> Back to Dashboard
            </a>
        </div>

        <!-- Form card -->
        <div class="form-card">
            <form method="POST">
                <div class="form-group">
                    <label for="title"><i class="fas fa-briefcase" style="margin-right: 6px;"></i> Job Title</label>
                    <input type="text" id="title" name="title" class="form-control" placeholder="e.g. Senior Software Engineer" required>
                </div>

                <div class="form-group">
                    <label for="position"><i class="fas fa-tag" style="margin-right: 6px;"></i> Job Position</label>
                    <input type="text" id="position" name="position" class="form-control" placeholder="e.g. Backend Developer" required>
                </div>

                <div class="form-group">
                    <label for="openings"><i class="fas fa-users" style="margin-right: 6px;"></i> Number of Openings</label>
                    <input type="number" id="openings" name="openings" class="form-control" placeholder="e.g. 3" min="1" required>
                </div>

                <div class="form-group">
                    <label for="description"><i class="fas fa-file-alt" style="margin-right: 6px;"></i> Job Description</label>
                    <textarea id="description" name="description" class="form-control" placeholder="Describe the role, responsibilities, requirements..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus-circle"></i> Add Job
                </button>
            </form>
        </div>

        <div class="footer-note">
            <i class="fas fa-robot" style="opacity: 0.6;"></i> Fill in the details to create a new job posting
        </div>
    </div>
</body>
</html>
